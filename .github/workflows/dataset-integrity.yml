name: Canonical Dataset Integrity

on:
  push:
    branches: [main]
    paths:
      - "data/final/**"
      - "data/stage2/state/records.jsonl"
      - "app/**"
      - "tests/stage2/**"
      - "requirements*.txt"
      - "stage2/**"
      - ".github/workflows/dataset-integrity.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install protobuf==4.25.3
          # Install streamlit with protobuf for testing
          pip install "streamlit>=1.30" --no-deps
          pip install protobuf==4.25.3
          # Install RAG deps needed by app imports
          pip install "numpy<2" torch==2.2.2 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<4.45" "sentence-transformers<3.1" chromadb pandas

      - name: Verify imports work
        run: |
          python -c "
          import streamlit
          from streamlit.testing.v1 import AppTest
          import rag.retriever_v2
          import rag.generator_v2
          import rag.agent
          import stage2.retrieval
          import stage2.release
          import stage2.agent
          import pipeline.query_layer
          print('All imports OK')
          "

      - name: Run policy and canonical-release tests
        run: python -m pytest -q tests/stage2

      - name: Build canonical dataset (generates fresh CSV/JSONL)
        run: python -m pipeline.build_final

      - name: Generate release manifest with correct checksums
        run: python -m stage2.release

      - name: Reconcile canonical JSONL, customer JSONL, CSV, and manifest
        run: python -m stage2.release --reconcile-only

      - name: Report final-gate status without padding an incomplete release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("data/final/release_manifest.json").read_text()
          )
          print(json.dumps({
              "record_count": manifest["record_count"],
              "qualifying_email_count": manifest["qualifying_email_count"],
              "source_mix": manifest["source_mix"],
              "release_ready": manifest["release_ready"],
              "readiness_failures": manifest["readiness_failures"],
          }, indent=2, sort_keys=True))
          PY
