# .github/workflows/dataset-integrity.yml
# Asserts the final dataset is well-formed and matches the schema
# the RAG layer expects. Catches the class of bug where someone
# renames a column and the app silently breaks.

name: Dataset Integrity

on:
  push:
    branches: [main]
    paths:
      - "data/final/**"
      - "pipeline/06_build_final_dataset.py"
      - ".github/workflows/dataset-integrity.yml"
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandas
        run: pip install pandas

      - name: Validate final dataset schema and content
        run: |
          python - <<'EOF'
          import sys
          import pandas as pd

          REQUIRED_COLS = [
              "Record ID", "Family Office Name", "Family Office Country",
              "Contact First Name", "Contact Last Name", "Contact Full Name",
              "Contact Job Title", "Contact Primary Email",
              "Primary E-Mail Validation Code",
              "Firm Verification URL", "Firm Verification Tier",
              "Contact Source URL", "Validation Status",
              "Confidence", "Last Verified Date",
          ]

          df = pd.read_csv("data/final/family_office_contacts.csv")
          print(f"Loaded {len(df)} rows, {len(df.columns)} columns")

          # Required columns present
          missing = [c for c in REQUIRED_COLS if c not in df.columns]
          if missing:
              print(f"FAIL: missing required columns: {missing}")
              sys.exit(1)

          # Minimum row count
          if len(df) < 20:
              print(f"FAIL: only {len(df)} rows; expected >= 20")
              sys.exit(1)

          # Record IDs unique and well-formed
          if df["Record ID"].duplicated().any():
              print("FAIL: duplicate Record IDs")
              sys.exit(1)
          if not df["Record ID"].str.match(r"^FOC_\d{3}$").all():
              print("FAIL: Record IDs not in FOC_### format")
              sys.exit(1)

          # Names must be non-empty
          empty_names = df["Contact Full Name"].isna().sum()
          if empty_names > 0:
              print(f"FAIL: {empty_names} rows have empty Contact Full Name")
              sys.exit(1)

          # Firm names must be non-empty
          empty_firms = df["Family Office Name"].isna().sum()
          if empty_firms > 0:
              print(f"FAIL: {empty_firms} rows have empty Family Office Name")
              sys.exit(1)

          # At least one firm should be represented multiple times (diversity check)
          firm_counts = df["Family Office Name"].value_counts()
          if len(firm_counts) < 3:
              print(f"FAIL: only {len(firm_counts)} firms represented; expected >= 3")
              sys.exit(1)

          # Confidence values are valid
          valid_conf = {"high", "medium", "low"}
          invalid_conf = set(df["Confidence"].dropna()) - valid_conf
          if invalid_conf:
              print(f"FAIL: invalid Confidence values: {invalid_conf}")
              sys.exit(1)

          print("PASS: dataset integrity checks all green")
          print(f"  Rows: {len(df)}")
          print(f"  Firms: {len(firm_counts)}")
          print(f"  Rows with email: {df['Contact Primary Email'].notna().sum()}")
          print(f"  Rows with high confidence: {(df['Confidence']=='high').sum()}")
          EOF