# .github/workflows/scheduled-run.yml
# Scheduled pipeline runs with staleness detection
# Runs every 12 hours to keep the dataset current

name: Scheduled Pipeline Run

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      run_type:
        description: 'Type of run'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - manual_refresh
          - staleness_check_only

permissions:
  contents: write  # Needed to commit updated data

jobs:
  scheduled-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for staleness comparison
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .
      
      - name: Build canonical database
        run: |
          python -m pipeline.build_final

      - name: Run discovery pipeline
        id: discovery
        run: |
          echo "=== Running Discovery ==="
          python pipeline/01_discover_expanded.py
          python pipeline/01_discover_more_v3.py
          python pipeline/02_extract_firms_v3.py
          python pipeline/03_sec_seed_v2.py
      
      - name: Run firm verification
        id: verification
        run: |
          echo "=== Running Firm Verification ==="
          python pipeline/04_verify_firms_v2.py
      
      - name: Run firm curation
        id: curation
        run: |
          echo "=== Running Firm Curation ==="
          python pipeline/04b_curate_verified_firms_v2.py
      
      - name: Run people extraction
        id: extraction
        run: |
          echo "=== Running People Extraction ==="
          python pipeline/05_extract_people_v3.py
      
      - name: Run contact enrichment
        id: enrichment
        run: |
          echo "=== Running Contact Enrichment ==="
          python pipeline/06_enrich_contacts.py
      
      - name: Build final dataset & staleness check
        id: finalize
        run: |
          echo "=== Building Final Dataset & Staleness Check ==="
          python pipeline/07_build_final_dataset_v2.py
      
      - name: Run test suite
        id: test
        run: |
          echo "=== Running Test Suite ==="
          python -m pytest tests/test_suite.py -v --tb=short
      
      - name: Check for staleness
        id: staleness
        run: |
          echo "=== Checking for Staleness ==="
          python -c "
import sqlite3
from datetime import datetime, timedelta

conn = sqlite3.connect('data/canonical/contacts.db')
cur = conn.cursor()

# Check for records not verified in last 30 days
cur.execute('''
    SELECT firm_name, last_verified_date 
    FROM firms 
    WHERE last_verified_date IS NOT NULL 
    AND last_verified_date < date('now', '-30 days')
''')
stale_firms = cur.fetchall()

# Check for people not verified in last 30 days
cur.execute('''
    SELECT record_id, full_name, last_verified_date 
    FROM people 
    WHERE status = 'qualifying' 
    AND last_verified_date IS NOT NULL 
    AND last_verified_date < date('now', '-30 days')
''')
stale_people = cur.fetchall()

# Check for source changes (content_changed)
cur.execute('''
    SELECT entity_type, entity_id, check_type, action_taken, evidence 
    FROM staleness_log 
    WHERE created_at > date('now', '-1 day')
    AND action_taken IN ('refreshed', 'quarantined', 'flagged')
''')
recent_actions = cur.fetchall()

conn.close()

print(f'STALE_FIRMS: {len(stale_firms)}')
for f in stale_firms:
    print(f'  STALE_FIRM: {f[0]} (last verified: {f[1]})')

print(f'STALE_PEOPLE: {len(stale_people)}')
for p in stale_people[:10]:
    print(f'  STALE_PERSON: {p[1]} ({p[0]}) (last verified: {p[2]})')

print(f'RECENT_STALENESS_ACTIONS: {len(recent_actions)}')
for a in recent_actions:
    print(f'  STALENESS_ACTION: {a[0]}:{a[1]} {a[2]} -> {a[3]} ({a[4][:100]})')

# Exit with code 1 if staleness detected (for workflow visibility)
import sys
if len(stale_firms) > 0 or len(stale_people) > 0:
    print('::warning::Staleness detected in dataset')
    sys.exit(0)  # Don't fail the build, just warn
"
      
      - name: Commit updated data
        if: github.event_name == 'schedule' || github.event.inputs.run_type == 'scheduled'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if data files changed
          if git diff --quiet data/; then
            echo "No data changes to commit"
          else
            git add data/
            git commit -m "chore: scheduled pipeline run - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "Data changes committed and pushed"
          fi
      
      - name: Upload run logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: |
            data/audit/
            data/raw/*_audit.jsonl
          retention-days: 90
      
      - name: Upload dataset snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dataset-snapshot-${{ github.run_id }}
          path: |
            data/final/
            data/canonical/contacts.db
          retention-days: 90

  # Separate job for staleness detection that can run more frequently
staleness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
       
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
       
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Run staleness detection
        run: |
          python -c "
import sqlite3
import requests
from bs4 import BeautifulSoup
import re

conn = sqlite3.connect('data/canonical/contacts.db')
conn.row_factory = sqlite3.Row
cur = conn.cursor()

# Get all qualifying firms with their official URLs
cur.execute('SELECT firm_id, firm_name, official_url, last_verified_date FROM firms WHERE official_url IS NOT NULL AND official_url != \"\"')
firms = cur.fetchall()

staleness_found = []

for firm in firms:
    firm_id = firm['firm_id']
    firm_name = firm['firm_name']
    url = firm['official_url']
    last_verified = firm['last_verified_date']
    
    try:
        # Fetch the firm's website
        headers = {'User-Agent': 'Mozilla/5.0 (research; contact@example.com)'}
        response = requests.get(url, headers=headers, timeout=15, allow_redirects=True)
        
        if response.status_code == 200:
            soup = BeautifulSoup(response.text, 'html.parser')
            
            # Remove script/style
            for tag in soup(['script', 'style', 'nav', 'footer']):
                tag.decompose()
            
            text = re.sub(r'\s+', ' ', soup.get_text(' '))
            low = text.lower()
            
            # Check if still self-describes as family office
            fo_phrases = ['family office', 'single-family office', 'multi-family office', 'family wealth', 'multi family office']
            still_fo = any(phrase in low for phrase in fo_phrases)
            
            if not still_fo:
                staleness_found.append({
                    'firm_id': firm_id,
                    'firm_name': firm_name,
                    'check_type': 'content_changed',
                    'previous_value': 'self-described as family office',
                    'current_value': 'no longer self-describes as family office',
                    'action_taken': 'flagged',
                    'evidence': f'Page content no longer contains family office language. Status: {response.status_code}'
                })
            else:
                # Content still valid, update last_verified_date
                cur.execute('UPDATE firms SET last_verified_date = ?, updated_at = ? WHERE firm_id = ?',
                           (datetime.now().isoformat(), datetime.now().isoformat(), firm_id))
        else:
            staleness_found.append({
                'firm_id': firm_id,
                'firm_name': firm_name,
                'check_type': 'source_gone',
                'previous_value': 'accessible',
                'current_value': f'HTTP {response.status_code}',
                'action_taken': 'flagged',
                'evidence': f'Firm website returned {response.status_code}'
            })
            
    except Exception as e:
        staleness_found.append({
            'firm_id': firm_id,
            'firm_name': firm_name,
            'check_type': 'fetch_error',
            'previous_value': 'accessible',
            'current_value': f'error: {type(e).__name__}',
            'action_taken': 'flagged',
            'evidence': str(e)
        })

# Log staleness findings
from datetime import datetime
run_id = None
cur.execute('INSERT INTO run_log (run_type, run_started, status, notes) VALUES (?, ?, ?, ?)',
           ('staleness_check', datetime.now().isoformat(), 'success', f'Checked {len(firms)} firms, found {len(staleness_found)} issues'))
run_id = cur.lastrowid

for s in staleness_found:
    cur.execute('''
        INSERT INTO staleness_log (run_id, entity_type, entity_id, check_type, previous_value, current_value, action_taken, evidence)
        VALUES (?, ?, ?, ?, ?, ?, ?, ?)
    ''', (run_id, 'firm', s['firm_id'], s['check_type'], s['previous_value'], s['current_value'], s['action_taken'], s['evidence']))

# Also check people emails
cur.execute('SELECT person_id, record_id, email FROM people WHERE status = \"qualifying\" AND email != \"\" AND email_validation_code IN (\"V1\", \"V2\")')
people = cur.fetchall()

import dns.resolver
for person in people:
    person_id = person['person_id']
    record_id = person['record_id']
    email = person['email']
    domain = email.split('@')[-1]
    
    try:
        answers = dns.resolver.resolve(domain, 'MX', lifetime=5)
    except Exception:
        cur.execute('''
            INSERT INTO staleness_log (run_id, entity_type, entity_id, check_type, previous_value, current_value, action_taken, evidence)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?)
        ''', (run_id, 'person', person_id, 'email_bounced', 'MX verified', 'MX verification failed', 'flagged', f'Email domain {domain} no longer has MX records'))

conn.commit()
conn.close()

print(f'Staleness check complete. Firms checked: {len(firms)}, Issues found: {len(staleness_found)}')
for s in staleness_found:
    print(f'  FLAGGED: {s[\"firm_name\"]} - {s[\"check_type\"]} - {s[\"evidence\"][:100]}')
"
      
      - name: Commit staleness log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet data/canonical/contacts.db; then
            echo "No staleness changes to commit"
          else
            git add data/canonical/contacts.db
            git commit -m "chore: staleness check - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "Staleness log committed and pushed"
          fi