[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polarity-falcon-iq"
version = "0.1.0"
description = "PolarityIQ — Family Office Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "torch==2.2.2",
    "transformers<4.45",
    "sentence-transformers<3.1",
    "streamlit>=1.30",
    "chromadb>=0.4.22,<1.0",
    "groq>=0.9",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "onnxruntime>=1.16.0",
    "tokenizers>=0.19.0",
    "protobuf<5",
    "ddgs>=4.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "dnspython>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "rag*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
